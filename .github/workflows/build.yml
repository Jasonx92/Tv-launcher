            String _s(dynamic v) => v == null ? '' : v.toString();

            String _arTeam(String name) {
              final l = name.toLowerCase();
              for (final e in _teamAr.entries) {
                if (l.contains(e.key)) return e.value;
              }
              return name;
            }

            String _fmtTime(DateTime t, bool ar) {
              var out = DateFormat('h:mm a', 'en').format(t);
              if (ar) out = out.replaceAll('AM', 'ص').replaceAll('PM', 'م');
              return out;
            }

            Future<List<Map<String, String>>> _fetchLeague(String slug) async {
              final res = await http
                  .get(Uri.parse('https://site.api.espn.com/apis/site/v2/sports/soccer/$slug/scoreboard'))
                  .timeout(const Duration(seconds: 15));
              if (res.statusCode != 200) throw Exception('http ${res.statusCode}');

              final body = json.decode(utf8.decode(res.bodyBytes));
              final List events = (body['events'] as List?) ?? [];
              final out = <Map<String, String>>[];
              final now = DateTime.now();

              for (final e in events) {
                final comps = e['competitions'] as List?;
                if (comps == null || comps.isEmpty) continue;
                final List teams = (comps.first['competitors'] as List?) ?? [];

                dynamic home;
                dynamic away;
                for (final t in teams) {
                  if (t['homeAway'] == 'home') home = t;
                  if (t['homeAway'] == 'away') away = t;
                }
                if (home == null || away == null) continue;

                final state = _s(e['status']?['type']?['state']);
                final statusName = _s(e['status']?['type']?['name']);
                if (statusName.contains('POSTPONED') || statusName.contains('CANCELED')) continue;

                final isLive = state == 'in';
                final kick = DateTime.tryParse(_s(e['date']))?.toLocal();
                if (kick == null) continue;
                final sameDay = kick.year == now.year && kick.month == now.month && kick.day == now.day;
                if (!sameDay && !isLive) continue;

                var homeEn = _s(home['team']?['shortDisplayName']);
                if (homeEn.isEmpty) homeEn = _s(home['team']?['displayName']);
                var awayEn = _s(away['team']?['shortDisplayName']);
                if (awayEn.isEmpty) awayEn = _s(away['team']?['displayName']);

                final showScore = state == 'in' || state == 'post';
                final scoreTxt = '${_s(home['score'])} - ${_s(away['score'])}';

                out.add({
                  'league_en': _leagueEn[slug] ?? slug,
                  'league_ar': _leagueAr[slug] ?? slug,
                  'teamA_en': homeEn,
                  'teamA_ar': _arTeam(homeEn),
                  'teamB_en': awayEn,
                  'teamB_ar': _arTeam(awayEn),
                  'time_en': showScore ? scoreTxt : _fmtTime(kick, false),
                  'time_ar': showScore ? scoreTxt : _fmtTime(kick, true),
                  'live': isLive.toString(),
                  'ts': kick.millisecondsSinceEpoch.toString().padLeft(15, '0'),
                });
              }
              return out;
            }

            Future<void> _fetchMatches() async {
              final slugs = _leagueAr.keys.where((k) => _selectedLeagues.contains(k)).toList();
              if (slugs.isEmpty) {
                if (mounted) {
                  setState(() {
                    _matches = [];
                    _matchesLoading = false;
                    _matchesError = '';
                  });
                }
                return;
              }

              int failures = 0;
              final results = await Future.wait(slugs.map((slug) async {
                try {
                  return await _fetchLeague(slug);
                } catch (_) {
                  failures++;
                  return <Map<String, String>>[];
                }
              }));

              final all = <Map<String, String>>[];
              for (final r in results) {
                all.addAll(r);
              }
              all.sort((a, b) => (a['ts'] ?? '').compareTo(b['ts'] ?? ''));

              if (!mounted) return;
              setState(() {
                _matchesLoading = false;
                if (failures == slugs.length) {
                  _matchesError = 'net';
                } else {
                  _matches = all;
                  _matchesError = '';
                }
              });
            }

            Widget _buildMatchesPlaceholder(bool isEn) {
              String msg;
              if (_matchesLoading) {
                msg = isEn ? 'Loading matches...' : 'جاري تحميل المباريات...';
              } else if (_selectedLeagues.isEmpty) {
                msg = isEn ? 'No leagues selected (see launcher settings)' : 'لم تختر أي دوري (من إعدادات اللانشر)';
              } else if (_matchesError.isNotEmpty) {
                msg = isEn ? 'Could not load matches' : 'تعذر تحميل المباريات';
              } else {
                msg = isEn ? 'No matches today' : 'لا توجد مباريات اليوم';
              }
              return Container(
                height: 86,
                alignment: AlignmentDirectional.centerStart,
                child: Text(msg, style: TextStyle(fontSize: 13, color: Colors.white.withOpacity(0.6))),
              );
            }

            Future<void> _fetchPrayerAndDateData() async {
              try {
                final res = await http.get(Uri.parse(
                    'https://api.aladhan.com/v1/timingsByCity?city=$_selectedCity&country=Oman&method=4'));
                if (res.statusCode == 200) {
                  final decodedUtf8 = utf8.decode(res.bodyBytes);
                  final jsonBody = json.decode(decodedUtf8)['data'];
                  final timings = jsonBody['timings'];
                  final hijri = jsonBody['date']['hijri'];
                  
                  final hDay = hijri['day'];
                  final hMonth = _selectedLanguage == 'en' ? hijri['month']['en'] : hijri['month']['ar'];
                  final hYear = hijri['year'];

                  if (mounted) {
                    setState(() {
                      _hijriDateStr = "$hDay $hMonth $hYear ${_selectedLanguage == 'en' ? 'AH' : 'هـ'}";
                      _applyAnchors(timings);
                      if (_selectedLanguage == 'en') {
                        _prayerTimes = {
                          'Fajr': timings['Fajr'],
                          'Dhuhr': timings['Dhuhr'],
                          'Asr': timings['Asr'],
                          'Maghrib': timings['Maghrib'],
                          'Isha': timings['Isha'],
                        };
                      } else {
                        _prayerTimes = {
                          'الفجر': timings['Fajr'],
                          'الظهر': timings['Dhuhr'],
                          'العصر': timings['Asr'],
                          'المغرب': timings['Maghrib'],
                          'العشاء': timings['Isha'],
                        };
                      }
                    });
                  }
                }
              } catch (_) {}
            }

            int? _mins(dynamic v) {
              final str = _s(v);
              final m = RegExp(r'(\d{1,2}):(\d{2})').firstMatch(str);
              if (m == null) return null;
              return int.parse(m.group(1)!) * 60 + int.parse(m.group(2)!);
            }

            void _applyAnchors(dynamic timings) {
              final f = _mins(timings['Fajr']);
              final r = _mins(timings['Sunrise']);
              final d = _mins(timings['Dhuhr']);
              final a = _mins(timings['Asr']);
              final m = _mins(timings['Maghrib']);
              final i = _mins(timings['Isha']);
              if (f == null || r == null || d == null || a == null || m == null || i == null) return;
              final ok = f + 20 < r && r + 90 < d && d < a && a < m - 40 && m + 30 < i && i + 60 < f - 40 + 1440;
              if (!ok) return;
              _aFajr = f;
              _aSunrise = r;
              _aDhuhr = d;
              _aAsr = a;
              _aMaghrib = m;
              _aIsha = i;
            }

            Future<void> _loadBackgroundAssets() async {
              try {
                final manifest = await AssetManifest.loadFromAssetBundle(rootBundle);
                final list = manifest.listAssets().where((a) => a.startsWith('assets/backgrounds/')).toList();
                if (mounted) setState(() => _bgAssets = list);
              } catch (_) {}
            }

            String _phaseKey() {
              final t = _currentTime.hour * 60 + _currentTime.minute;
              if (t >= _aFajr && t < _aSunrise + 90) return 'dawn';
              if (t >= _aSunrise + 90 && t < _aAsr) return 'day';
              if (t >= _aAsr && t < _aMaghrib - 30) return 'afternoon';
              if (t >= _aMaghrib - 30 && t < _aIsha) return 'sunset';
              return 'night';
            }

            String? _bgPhotoPath() {
              if (_bgAssets.isEmpty) return null;
              final key = _phaseKey();
              final list = _bgAssets.where((a) => a.split('/').last.toLowerCase().startsWith(key)).toList()..sort();
              if (list.isEmpty) return null;
              final doy = _currentTime.difference(DateTime(_currentTime.year, 1, 1)).inDays;
              return list[doy % list.length];
            }

            Widget _buildBackground() {
              final photo = _bgPhotoPath();
              if (photo != null) {
                return AnimatedSwitcher(
                  duration: const Duration(seconds: 2),
                  child: SizedBox.expand(
                    key: ValueKey(photo),
                    child: Image.asset(photo, fit: BoxFit.cover, gaplessPlayback: true),
                  ),
                );
              }
              final t = _currentTime.hour * 60 + _currentTime.minute;
              return RepaintBoundary(
                child: CustomPaint(
                  painter: _SkyPainter(
                    minute: t,
                    fajr: _aFajr,
                    sunrise: _aSunrise,
                    dhuhr: _aDhuhr,
                    asr: _aAsr,
                    maghrib: _aMaghrib,
                    isha: _aIsha,
                  ),
                  child: const SizedBox.expand(),
                ),
              );
            }

            Widget _centeredScroller(List<Widget> children, {double vertical = 12}) {
              return LayoutBuilder(builder: (context, constraints) {
                return SingleChildScrollView(
                  scrollDirection: Axis.horizontal,
                  padding: EdgeInsets.symmetric(horizontal: 12, vertical: vertical),
                  child: ConstrainedBox(
                    constraints: BoxConstraints(minWidth: constraints.maxWidth - 24),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: children,
                    ),
                  ),
                );
              });
            }

            Widget _appTileContent(AppInfo app) {
              final banner = _banners[app.packageName];
              if (banner != null) {
                return Image.memory(banner, fit: BoxFit.cover, gaplessPlayback: true);
              }
              final icon = app.icon;
              if (icon == null) {
                return Container(
                  color: const Color(0xFF1E293B),
                  child: const Center(child: Icon(Icons.tv_rounded, size: 40, color: Colors.white70)),
                );
              }
              return Stack(
                fit: StackFit.expand,
                children: [
                  Container(color: const Color(0xFF1E293B)),
                  ImageFiltered(
                    imageFilter: ImageFilter.blur(sigmaX: 22, sigmaY: 22),
                    child: Image.memory(icon, fit: BoxFit.cover),
                  ),
                  Container(color: Colors.black.withOpacity(0.10)),
                  Center(
                    child: ClipRRect(
                      borderRadius: BorderRadius.circular(14),
                      child: Image.memory(icon, width: 56, height: 56, fit: BoxFit.contain),
                    ),
                  ),
                ],
              );
            }

            Widget _buildAppTile({
