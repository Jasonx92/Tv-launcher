name: Build TV Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Android TV Project
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'icon.jpg' ! -name 'icon.png' -exec rm -rf {} +
          flutter create --org com.luban --project-name luban_tv --platforms=android .
          yes | flutter doctor --android-licenses || true

          # ضبط إعدادات التوافق لأندرويد
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Configure Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: luban_tv
          description: "Luban Ambient Smart TV Launcher"
          publish_to: "none"
          version: 2.1.4+23

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            intl: ^0.19.0
            http: ^1.2.0
            installed_apps: ^2.1.1
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF
          flutter pub get

      - name: Auto-Crop & Generate Native App Icons & TV Banner
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f "icon.jpg" ]; then
            SRC="icon.jpg"
          elif [ -f "icon.png" ]; then
            SRC="icon.png"
          else
            SRC=""
          fi

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          mkdir -p android/app/src/main/res/drawable-xhdpi

          if [ -n "$SRC" ]; then
            convert "$SRC" -gravity center -crop 1:1 +repage square_icon.png
            convert square_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert square_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert square_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert square_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert square_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$SRC" -resize 320x180^ -gravity center -extent 320x180 android/app/src/main/res/drawable-xhdpi/ic_launcher_banner.png
          fi

      - name: Configure Android TV Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              
              <application
                  android:label="Luban TV"
                  android:name="${applicationName}"
                  android:banner="@drawable/ic_launcher_banner"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Complete Launcher Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:installed_apps/app_info.dart';
          import 'package:installed_apps/installed_apps.dart';
          import 'package:intl/intl.dart';
          import 'package:intl/date_symbol_data_local.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await initializeDateFormatting('ar', null);
            await initializeDateFormatting('en', null);
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            runApp(const LubanTVApp());
          }

          class LubanTVApp extends StatefulWidget {
            const LubanTVApp({super.key});

            static void updateFont(BuildContext context) {
              context.findAncestorStateOfType<_LubanTVAppState>()?.loadFontSetting();
            }

            @override
            State<LubanTVApp> createState() => _LubanTVAppState();
          }

          class _LubanTVAppState extends State<LubanTVApp> {
            String _selectedFont = 'sans-serif';

            @override
            void initState() {
              super.initState();
              loadFontSetting();
            }

            Future<void> loadFontSetting() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedFont = prefs.getString('pref_font') ?? 'sans-serif';
              });
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Luban TV',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  fontFamily: _selectedFont,
                ),
                home: const LubanHomeScreen(),
              );
            }
          }

          class LubanHomeScreen extends StatefulWidget {
            const LubanHomeScreen({super.key});

            @override
            State<LubanHomeScreen> createState() => _LubanHomeScreenState();
          }

          class _LubanHomeScreenState extends State<LubanHomeScreen> {
            DateTime _currentTime = DateTime.now();
            Timer? _clockTimer;
            List<AppInfo> _allInstalledApps = [];
            List<AppInfo> _favoriteApps = [];
            bool _loadingApps = true;
            String _hijriDateStr = "-- هـ";
            String _selectedCity = "Salalah";
            String _selectedCityAr = "صلالة";
            String _selectedLanguage = "hybrid";
            String _selectedFont = "sans-serif";
            bool _showMatchesBar = true;

            Map<String, String> _prayerTimes = {
              'الفجر': '--:--',
              'الظهر': '--:--',
              'العصر': '--:--',
              'المغرب': '--:--',
              'العشاء': '--:--',
            };

            final List<Map<String, dynamic>> _matches = [
              {
                'league_ar': 'دوري أبطال أوروبا',
                'league_en': 'UEFA Champions League',
                'teamA_ar': 'ريال مدريد',
                'teamA_en': 'Real Madrid',
                'teamB_ar': 'مانشستر سيتي',
                'teamB_en': 'Man City',
                'time_ar': '11:00 م',
                'time_en': '11:00 PM',
              },
              {
                'league_ar': 'الدوري الإنجليزي',
                'league_en': 'Premier League',
                'teamA_ar': 'ليفربول',
                'teamA_en': 'Liverpool',
                'teamB_ar': 'أرسنال',
                'teamB_en': 'Arsenal',
                'time_ar': '8:30 م',
                'time_en': '8:30 PM',
              },
              {
                'league_ar': 'دوري روشن',
                'league_en': 'Roshn Saudi League',
                'teamA_ar': 'الهلال',
                'teamA_en': 'Al Hilal',
                'teamB_ar': 'النصر',
                'teamB_en': 'Al Nassr',
                'time_ar': '9:00 م',
                'time_en': '9:00 PM',
              },
            ];

            @override
            void initState() {
              super.initState();
              _loadPreferences();
              _loadAppsAndFavorites();
              _clockTimer = Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() => _currentTime = DateTime.now());
              });
            }

            @override
            void dispose() {
              _clockTimer?.cancel();
              super.dispose();
            }

            Future<void> _loadPreferences() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedCity = prefs.getString('pref_city') ?? "Salalah";
                _selectedCityAr = prefs.getString('pref_city_ar') ?? "صلالة";
                _selectedLanguage = prefs.getString('pref_language') ?? "hybrid";
                _selectedFont = prefs.getString('pref_font') ?? "sans-serif";
                _showMatchesBar = prefs.getBool('pref_show_matches') ?? true;
              });
              _fetchPrayerAndDateData();
            }

            Future<void> _loadAppsAndFavorites() async {
              try {
                final apps = await InstalledApps.getInstalledApps(withIcon: true, packageNamePrefix: '');
                final prefs = await SharedPreferences.getInstance();
                final savedFavs = prefs.getStringList('fav_apps');

                List<AppInfo> favs = [];
                if (savedFavs != null && savedFavs.isNotEmpty) {
                  for (var pkg in savedFavs) {
                    final matches = apps.where((a) => a.packageName == pkg);
                    if (matches.isNotEmpty) favs.add(matches.first);
                  }
                } else {
                  favs = apps.take(7).toList();
                  await _saveFavorites(favs);
                }

                if (mounted) {
                  setState(() {
                    _allInstalledApps = apps;
                    _favoriteApps = favs;
                    _loadingApps = false;
                  });
                }
              } catch (_) {
                if (mounted) setState(() => _loadingApps = false);
              }
            }

            Future<void> _saveFavorites(List<AppInfo> apps) async {
              final prefs = await SharedPreferences.getInstance();
              final pkgList = apps.map((a) => a.packageName).toList();
              await prefs.setStringList('fav_apps', pkgList);
            }

            void _moveApp(int oldIndex, int newIndex) {
              if (newIndex < 0 || newIndex >= _favoriteApps.length) return;
              setState(() {
                final item = _favoriteApps.removeAt(oldIndex);
                _favoriteApps.insert(newIndex, item);
              });
              _saveFavorites(_favoriteApps);
            }

            void _removeApp(int index) {
              setState(() {
                _favoriteApps.removeAt(index);
              });
              _saveFavorites(_favoriteApps);
            }

            void _addAppToFav(AppInfo app) {
              if (_favoriteApps.any((a) => a.packageName == app.packageName)) return;
              setState(() {
                _favoriteApps.add(app);
              });
              _saveFavorites(_favoriteApps);
            }

            void _openSystemSettings() async {
              try {
                await InstalledApps.startApp('com.android.tv.settings');
              } catch (_) {
                try {
                  await InstalledApps.startApp('com.android.settings');
                } catch (_) {}
              }
            }

            void _showLauncherSettingsDialog() {
              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setDlgState) => AlertDialog(
                    backgroundColor: const Color(0xFF1E293B),
                    title: Text(
                      _selectedLanguage == 'en' ? "Luban TV Settings" : "إعدادات لانشر لبان",
                      style: const TextStyle(color: Colors.white, fontSize: 18),
                    ),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          ListTile(
                            leading: const Icon(Icons.language, color: Color(0xFF38BDF8)),
                            title: Text(_selectedLanguage == 'en' ? "Language Mode" : "وضع اللغة"),
                            trailing: DropdownButton<String>(
                              value: _selectedLanguage,
                              dropdownColor: const Color(0xFF0F172A),
                              items: const [
                                DropdownMenuItem(value: "hybrid", child: Text("مختلط (عربي + إنجليزي)")),
                                DropdownMenuItem(value: "ar", child: Text("كامل عربي (Full Arabic)")),
                                DropdownMenuItem(value: "en", child: Text("كامل إنجليزي (Full English)")),
                              ],
                              onChanged: (val) async {
                                if (val != null) {
                                  final prefs = await SharedPreferences.getInstance();
                                  await prefs.setString('pref_language', val);
                                  setDlgState(() => _selectedLanguage = val);
                                  setState(() => _selectedLanguage = val);
                                  _fetchPrayerAndDateData();
                                }
                              },
                            ),
                          ),
                          ListTile(
                            leading: const Icon(Icons.font_download, color: Color(0xFF38BDF8)),
                            title: Text(_selectedLanguage == 'en' ? "Font Style" : "نمط الخط"),
                            trailing: DropdownButton<String>(
                              value: _selectedFont,
                              dropdownColor: const Color(0xFF0F172A),
                              items: const [
                                DropdownMenuItem(value: "sans-serif", child: Text("Modern (افتراضي)")),
                                DropdownMenuItem(value: "sans-serif-medium", child: Text("Bold (عريض)")),
                                DropdownMenuItem(value: "sans-serif-light", child: Text("Light (ناعم)")),
                                DropdownMenuItem(value: "serif", child: Text("Serif (كلاسيكي)")),
                              ],
                              onChanged: (val) async {
                                if (val != null) {
                                  final prefs = await SharedPreferences.getInstance();
                                  await prefs.setString('pref_font', val);
                                  setDlgState(() => _selectedFont = val);
                                  setState(() => _selectedFont = val);
                                  LubanTVApp.updateFont(context);
                                }
                              },
                            ),
                          ),
                          ListTile(
                            leading: const Icon(Icons.location_city, color: Color(0xFF38BDF8)),
                            title: Text(_selectedLanguage == 'en' ? "Prayer Times City" : "مدينة أوقات الصلاة"),
                            trailing: DropdownButton<String>(
                              value: _selectedCity,
                              dropdownColor: const Color(0xFF0F172A),
                              items: [
                                DropdownMenuItem(value: "Salalah", child: Text(_selectedLanguage == 'en' ? "Salalah" : "صلالة")),
                                DropdownMenuItem(value: "Muscat", child: Text(_selectedLanguage == 'en' ? "Muscat" : "مسقط")),
                                DropdownMenuItem(value: "Nizwa", child: Text(_selectedLanguage == 'en' ? "Nizwa" : "نزوى")),
                                DropdownMenuItem(value: "Sohar", child: Text(_selectedLanguage == 'en' ? "Sohar" : "صحار")),
                                DropdownMenuItem(value: "Sur", child: Text(_selectedLanguage == 'en' ? "Sur" : "صور")),
                              ],
                              onChanged: (val) async {
                                if (val != null) {
                                  final mapAr = {
                                    "Salalah": "صلالة",
                                    "Muscat": "مسقط",
                                    "Nizwa": "نزوى",
                                    "Sohar": "صحار",
                                    "Sur": "صور",
                                  };
                                  final prefs = await SharedPreferences.getInstance();
                                  await prefs.setString('pref_city', val);
                                  await prefs.setString('pref_city_ar', mapAr[val]!);
                                  setDlgState(() {
                                    _selectedCity = val;
                                    _selectedCityAr = mapAr[val]!;
                                  });
                                  setState(() {
                                    _selectedCity = val;
                                    _selectedCityAr = mapAr[val]!;
                                  });
                                  _fetchPrayerAndDateData();
                                }
                              },
                            ),
                          ),
                          SwitchListTile(
                            activeColor: const Color(0xFF38BDF8),
                            secondary: const Icon(Icons.sports_soccer, color: Color(0xFF38BDF8)),
                            title: Text(_selectedLanguage == 'en' ? "Show Matches Bar" : "عرض شريط مباريات اليوم"),
                            value: _showMatchesBar,
                            onChanged: (val) async {
                              final prefs = await SharedPreferences.getInstance();
                              await prefs.setBool('pref_show_matches', val);
                              setDlgState(() => _showMatchesBar = val);
                              setState(() => _showMatchesBar = val);
                            },
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.pop(ctx),
                        child: Text(_selectedLanguage == 'en' ? "Close" : "إغلاق", style: const TextStyle(color: Color(0xFF38BDF8))),
                      ),
                    ],
                  ),
                ),
              );
            }

            void _showExitDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: Text(_selectedLanguage == 'en' ? "Exit Launcher" : "الخروج من اللانشر", style: const TextStyle(color: Colors.white, fontSize: 18)),
                  content: Text(_selectedLanguage == 'en' ? "Do you want to close Luban TV and return to default home?" : "هل تريد إغلاق اللانشر والعودة للشاشة السابقة؟"),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: Text(_selectedLanguage == 'en' ? "Cancel" : "إلغاء", style: const TextStyle(color: Colors.white70)),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
                      onPressed: () {
                        Navigator.pop(ctx);
                        SystemNavigator.pop();
                      },
                      child: Text(_selectedLanguage == 'en' ? "Exit" : "خروج"),
                    ),
                  ],
                ),
              );
            }

            void _showAppOptionsDialog(int index) {
              final app = _favoriteApps[index];
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: Text(app.name, style: const TextStyle(color: Colors.white, fontSize: 18)),
                  content: Column(
                    mainAxisSize: dynamicMinSize(context),
                    children: [
                      if (index > 0)
                        ListTile(
                          leading: const Icon(Icons.arrow_back, color: Color(0xFF38BDF8)),
                          title: Text(_selectedLanguage == 'en' ? "Move Left" : "تحريك لليسار"),
                          onTap: () {
                            Navigator.pop(ctx);
                            _moveApp(index, index - 1);
                          },
                        ),
                      if (index < _favoriteApps.length - 1)
                        ListTile(
                          leading: const Icon(Icons.arrow_forward, color: Color(0xFF38BDF8)),
                          title: Text(_selectedLanguage == 'en' ? "Move Right" : "تحريك لليمين"),
                          onTap: () {
                            Navigator.pop(ctx);
                            _moveApp(index, index + 1);
                          },
                        ),
                      ListTile(
                        leading: const Icon(Icons.delete_outline, color: Colors.redAccent),
                        title: Text(_selectedLanguage == 'en' ? "Remove from Favorites" : "إزالة من المفضلة", style: const TextStyle(color: Colors.redAccent)),
                        onTap: () {
                          Navigator.pop(ctx);
                          _removeApp(index);
                        },
                      ),
                    ],
                  ),
                ),
              );
            }

            List<Widget> dynamicMinSize(BuildContext context) => [];

            void _openAllAppsModal() {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF0F172A),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (ctx) {
                  return Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 32, vertical: 20),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          _selectedLanguage == 'en' ? "Customize Favorite Apps" : "تخصيص التطبيقات المفضلة",
                          style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white),
                        ),
                        const SizedBox(height: 16),
                        Expanded(
                          child: GridView.builder(
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 6,
                              crossAxisSpacing: 16,
                              mainAxisSpacing: 16,
                              childAspectRatio: 0.9,
                            ),
                            itemCount: _allInstalledApps.length,
                            itemBuilder: (context, i) {
                              final app = _allInstalledApps[i];
                              final isFav = _favoriteApps.any((a) => a.packageName == app.packageName);
                              return Focus(
                                child: Builder(builder: (c) {
                                  final hasFoc = Focus.of(c).hasFocus;
                                  return InkWell(
                                    onTap: () {
                                      if (isFav) {
                                        final idx = _favoriteApps.indexWhere((a) => a.packageName == app.packageName);
                                        if (idx != -1) _removeApp(idx);
                                      } else {
                                        _addAppToFav(app);
                                      }
                                      Navigator.pop(ctx);
                                    },
                                    child: AnimatedContainer(
                                      duration: const Duration(milliseconds: 140),
                                      decoration: BoxDecoration(
                                        color: hasFoc ? Colors.white24 : Colors.white10,
                                        borderRadius: BorderRadius.circular(16),
                                        border: Border.all(
                                          color: hasFoc ? const Color(0xFF38BDF8) : (isFav ? Colors.greenAccent : Colors.transparent),
                                          width: 2,
                                        ),
                                      ),
                                      child: Column(
                                        mainAxisAlignment: MainAxisAlignment.center,
                                        children: [
                                          if (app.icon != null)
                                            Image.memory(app.icon!, width: 42, height: 42)
                                          else
                                            const Icon(Icons.android, size: 42, color: Colors.white),
                                          const SizedBox(height: 6),
                                          Text(
                                            app.name,
                                            maxLines: 1,
                                            overflow: TextOverflow.ellipsis,
                                            style: const TextStyle(fontSize: 11),
                                          ),
                                          const SizedBox(height: 2),
                                          Icon(
                                            isFav ? Icons.check_circle : Icons.add_circle_outline,
                                            size: 16,
                                            color: isFav ? Colors.greenAccent : Colors.white60,
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                }),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Future<void> _fetchPrayerAndDateData() async {
              try {
                final res = await http.get(Uri.parse(
                    'https://api.aladhan.com/v1/timingsByCity?city=$_selectedCity&country=Oman&method=4'));
                if (res.statusCode == 200) {
                  final jsonBody = json.decode(res.body)['data'];
                  final timings = jsonBody['timings'];
                  final hijri = jsonBody['date']['hijri'];
                  
                  final hDay = hijri['day'];
                  final hMonth = _selectedLanguage == 'en' ? hijri['month']['en'] : hijri['month']['ar'];
                  final hYear = hijri['year'];

                  if (mounted) {
                    setState(() {
                      _hijriDateStr = "$hDay $hMonth $hYear ${_selectedLanguage == 'en' ? 'AH' : 'هـ'}";
                      if (_selectedLanguage == 'en') {
                        _prayerTimes = {
                          'Fajr': timings['Fajr'],
                          'Dhuhr': timings['Dhuhr'],
                          'Asr': timings['Asr'],
                          'Maghrib': timings['Maghrib'],
                          'Isha': timings['Isha'],
                        };
                      } else {
                        _prayerTimes = {
                          'الفجر': timings['Fajr'],
                          'الظهر': timings['Dhuhr'],
                          'العصر': timings['Asr'],
                          'المغرب': timings['Maghrib'],
                          'العشاء': timings['Isha'],
                        };
                      }
                    });
                  }
                }
              } catch (_) {}
            }

            String _getDynamicBackground() {
              final h = _currentTime.hour;
              if (h >= 5 && h < 11) {
                return "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1920&q=80";
              } else if (h >= 11 && h < 16) {
                return "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80";
              } else if (h >= 16 && h < 19) {
                return "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80";
              } else {
                return "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80";
              }
            }

            Widget _buildTopButton({required IconData icon, required String tooltip, required VoidCallback onTap, Color color = Colors.white70}) {
              return Focus(
                child: Builder(builder: (ctx) {
                  final hasFoc = Focus.of(ctx).hasFocus;
                  return InkWell(
                    onTap: onTap,
                    borderRadius: BorderRadius.circular(14),
                    child: AnimatedContainer(
                      duration: const Duration(milliseconds: 140),
                      padding: const EdgeInsets.all(10),
                      decoration: BoxDecoration(
                        color: hasFoc ? const Color(0xFF1E293B) : Colors.black.withOpacity(0.4),
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(
                          color: hasFoc ? const Color(0xFF38BDF8) : Colors.white24,
                          width: hasFoc ? 2 : 1,
                        ),
                        boxShadow: hasFoc
                            ? [BoxShadow(color: const Color(0xFF38BDF8).withOpacity(0.4), blurRadius: 10)]
                            : [],
                      ),
                      child: Icon(icon, size: 20, color: hasFoc ? const Color(0xFF38BDF8) : color),
                    ),
                  );
                }),
              );
            }

