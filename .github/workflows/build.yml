            Widget _bgImage(String name) {
              final live = _liveFiles[name];
              final Widget img = live != null
                  ? Image.file(
                      File(live),
                      fit: BoxFit.cover,
                      gaplessPlayback: true,
                      cacheWidth: 1920,
                      errorBuilder: (ctx, _, __) => _assetImage(name),
                    )
                  : _assetImage(name);
              return AnimatedSwitcher(
                duration: const Duration(seconds: 2),
                child: SizedBox.expand(key: ValueKey(live ?? name), child: img),
              );
            }

            _BgPair _bgPair({bool all = false}) {
              final keys = _bgTimeline(all: all);
              if (keys.isEmpty) return const _BgPair('', '', 0);
              final t = _currentTime.hour * 60 + _currentTime.minute;
              var a = keys.first.value;
              var b = a;
              var f = 0.0;
              if (t >= keys.last.key) {
                a = keys.last.value;
                b = a;
              } else if (t >= keys.first.key) {
                for (var i = 0; i < keys.length - 1; i++) {
                  if (t >= keys[i].key && t < keys[i + 1].key) {
                    a = keys[i].value;
                    b = keys[i + 1].value;
                    f = Curves.easeInOut.transform((t - keys[i].key) / (keys[i + 1].key - keys[i].key));
                    break;
                  }
                }
              }
              return _BgPair(a, b, f);
            }

