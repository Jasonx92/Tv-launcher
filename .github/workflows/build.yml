name: Build TV Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android TV Project
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          flutter create --org com.mflauncher --project-name tv_launcher --platforms=android .
          yes | flutter doctor --android-licenses || true

          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Configure Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: tv_launcher
          description: "MF Launcher"
          publish_to: "none"
          version: 1.1.1+3

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            intl: ^0.19.0
            http: ^1.2.0

          flutter:
            uses-material-design: true
          EOF
          flutter pub get

      - name: Configure Android TV Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="MF Launcher"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Launcher Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:intl/intl.dart';
          import 'package:intl/date_symbol_data_local.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await initializeDateFormatting('ar', null);
            runApp(const TVLauncherApp());
          }

          class TVLauncherApp extends StatelessWidget {
            const TVLauncherApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MF Launcher',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  fontFamily: 'sans-serif',
                ),
                home: const TVHomeScreen(),
              );
            }
          }

          class TVHomeScreen extends StatefulWidget {
            const TVHomeScreen({super.key});
            @override
            State<TVHomeScreen> createState() => _TVHomeScreenState();
          }

          class _TVHomeScreenState extends State<TVHomeScreen> {
            DateTime _currentTime = DateTime.now();
            Timer? _timer;
            Map<String, String> _prayerTimes = {
              'الفجر': '--:--',
              'الظهر': '--:--',
              'العصر': '--:--',
              'المغرب': '--:--',
              'العشاء': '--:--',
            };

            final List<Map<String, dynamic>> _apps = [
              {'name': 'YouTube', 'icon': Icons.play_arrow_rounded, 'color': Colors.red},
              {'name': 'Netflix', 'icon': Icons.movie_filter_rounded, 'color': Colors.redAccent},
              {'name': 'القرآن الكريم', 'icon': Icons.menu_book_rounded, 'color': Colors.green},
              {'name': 'البث المباشر', 'icon': Icons.live_tv_rounded, 'color': Colors.blueAccent},
              {'name': 'الملفات', 'icon': Icons.folder_rounded, 'color': Colors.amber},
              {'name': 'الإعدادات', 'icon': Icons.settings_rounded, 'color': Colors.grey},
            ];

            @override
            void initState() {
              super.initState();
              _timer = Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() => _currentTime = DateTime.now());
              });
              _fetchPrayerTimes();
            }

            @override
            void dispose() {
              _timer?.cancel();
              super.dispose();
            }

            Future<void> _fetchPrayerTimes() async {
              try {
                final res = await http.get(Uri.parse(
                    'https://api.aladhan.com/v1/timingsByCity?city=Salalah&country=Oman&method=4'));
                if (res.statusCode == 200) {
                  final data = json.decode(res.body)['data']['timings'];
                  if (mounted) {
                    setState(() {
                      _prayerTimes = {
                        'الفجر': data['Fajr'],
                        'الظهر': data['Dhuhr'],
                        'العصر': data['Asr'],
                        'المغرب': data['Maghrib'],
                        'العشاء': data['Isha'],
                      };
                    });
                  }
                }
              } catch (_) {}
            }

            List<Color> _getTimeGradient() {
              final h = _currentTime.hour;
              if (h >= 5 && h < 11) {
                return [const Color(0xFF1E3A8A), const Color(0xFF0F172A)];
              } else if (h >= 11 && h < 17) {
                return [const Color(0xFF0369A1), const Color(0xFF0C4A6E)];
              } else if (h >= 17 && h < 19) {
                return [const Color(0xFF7C2D12), const Color(0xFF1E1B4B)];
              } else {
                return [const Color(0xFF0F172A), const Color(0xFF020617)];
              }
            }

            @override
            Widget build(BuildContext context) {
              final timeStr = DateFormat('hh:mm').format(_currentTime);
              final periodStr = DateFormat('a').format(_currentTime) == 'AM' ? 'ص' : 'م';
              final dateStr = DateFormat('EEEE، d MMMM', 'ar').format(_currentTime);

              return Scaffold(
                body: AnimatedContainer(
                  duration: const Duration(seconds: 2),
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topRight,
                      end: Alignment.bottomLeft,
                      colors: _getTimeGradient(),
                    ),
                  ),
                  child: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 24),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Row(
                                    crossAxisAlignment: CrossAxisAlignment.baseline,
                                    textBaseline: TextBaseline.alphabetic,
                                    children: [
                                      Text(
                                        timeStr,
                                        style: const TextStyle(
                                          fontSize: 54,
                                          fontWeight: FontWeight.bold,
                                          color: Colors.white,
                                        ),
                                      ),
                                      const SizedBox(width: 8),
                                      Text(
                                        periodStr,
                                        style: const TextStyle(fontSize: 20, color: Colors.white70),
                                      ),
                                    ],
                                  ),
                                  Text(
                                    dateStr,
                                    style: const TextStyle(fontSize: 16, color: Colors.white60),
                                  ),
                                  const SizedBox(height: 4),
                                  const Text(
                                    "MF Launcher",
                                    style: TextStyle(fontSize: 13, color: Colors.white38, letterSpacing: 1.1),
                                  ),
                                ],
                              ),
                              Container(
                                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                                decoration: BoxDecoration(
                                  color: Colors.black.withOpacity(0.35),
                                  borderRadius: BorderRadius.circular(16),
                                  border: Border.all(color: Colors.white10),
                                ),
                                child: Row(
                                  children: _prayerTimes.entries.map((entry) {
                                    return Padding(
                                      padding: const EdgeInsets.symmetric(horizontal: 8),
                                      child: Column(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          Text(
                                            entry.key,
                                            style: const TextStyle(fontSize: 11, color: Colors.white60),
                                          ),
                                          const SizedBox(height: 3),
                                          Text(
                                            entry.value,
                                            style: const TextStyle(
                                              fontSize: 13,
                                              fontWeight: FontWeight.bold,
                                              color: Color(0xFF38BDF8),
                                            ),
                                          ),
                                        ],
                                      ),
                                    );
                                  }).toList(),
                                ),
                              ),
                            ],
                          ),
                          const Spacer(),
                          const Text(
                            "التطبيقات المفضلة",
                            style: TextStyle(
                              fontSize: 17,
                              fontWeight: FontWeight.bold,
                              color: Colors.white70,
                            ),
                          ),
                          const SizedBox(height: 14),
                          SizedBox(
                            height: 125,
                            child: ListView.builder(
                              scrollDirection: Axis.horizontal,
                              itemCount: _apps.length,
                              itemBuilder: (context, index) {
                                final app = _apps[index];
                                return Focus(
                                  child: Builder(builder: (ctx) {
                                    final isFocused = Focus.of(ctx).hasFocus;
                                    return AnimatedContainer(
                                      duration: const Duration(milliseconds: 180),
                                      width: 115,
                                      margin: const EdgeInsets.only(right: 14),
                                      transform: isFocused
                                          ? (Matrix4.identity()..scale(1.08))
                                          : Matrix4.identity(),
                                      decoration: BoxDecoration(
                                        color: isFocused
                                            ? Colors.white.withOpacity(0.25)
                                            : Colors.black.withOpacity(0.3),
                                        borderRadius: BorderRadius.circular(20),
                                        border: Border.all(
                                          color: isFocused
                                              ? const Color(0xFF38BDF8)
                                              : Colors.white12,
                                          width: isFocused ? 2.5 : 1,
                                        ),
                                        boxShadow: isFocused
                                            ? [
                                                BoxShadow(
                                                  color: const Color(0xFF38BDF8).withOpacity(0.4),
                                                  blurRadius: 15,
                                                  spreadRadius: 1,
                                                )
                                              ]
                                            : [],
                                      ),
                                      child: Column(
                                        mainAxisAlignment: MainAxisAlignment.center,
                                        children: [
                                          Icon(app['icon'], size: 42, color: app['color']),
                                          const SizedBox(height: 8),
                                          Text(
                                            app['name'],
                                            style: const TextStyle(
                                              fontSize: 12,
                                              fontWeight: FontWeight.w500,
                                              color: Colors.white,
                                            ),
                                          ),
                                        ],
                                      ),
                                    );
                                  }),
                                );
                              },
                            ),
                          ),
                          const SizedBox(height: 10),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Launcher-v1.1.1-Mohammed-Fadhil
          path: build/app/outputs/flutter-apk/app-debug.apk
