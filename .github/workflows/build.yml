name: Build TV Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Android TV Project
        run: |
          # تنظيف المجلد وتجهيز المشروع
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          flutter create --org com.omantv --project-name tv_launcher --platforms=android .
          
          # قبول تراخيص الأندرويد تلقائياً
          yes | flutter doctor --android-licenses || true
          
          # تثبيت الحزم
          flutter pub add intl device_apps url_launcher
          
          # تجهيز مجلد الصور
          mkdir -p assets/backgrounds
          curl -s -L -o assets/backgrounds/noon.jpg "https://picsum.photos/1920/1080"
          curl -s -L -o assets/backgrounds/night.jpg "https://picsum.photos/1920/1080"
          
          # إدراج مسار الصور في pubspec.yaml
          sed -i '/flutter:/a \  assets:\n    - assets/backgrounds/' pubspec.yaml

      - name: Configure Leanback Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label="Oman TV Launcher"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.AppCompat.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oman-TV-Launcher-v1.0.0-Mohammed-Fadhil
          path: build/app/outputs/flutter-apk/app-debug.apk
