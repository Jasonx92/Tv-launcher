            Widget _buildAppsBar(bool isEn) {
              if (_loadingApps) {
                return const SizedBox(height: 150, child: Center(child: CircularProgressIndicator()));
              }
              final tiles = <Widget>[];
              for (var i = 0; i < _favoriteApps.length; i++) {
                final app = _favoriteApps[i];
                final index = i;
                tiles.add(_buildAppTile(
                  content: _appTileContent(app),
                  label: app.name,
                  autofocus: i == 0,
                  onTap: () => _launchApp(app.packageName),
                  onLongPress: () => _showAppOptionsDialog(index),
                ));
              }
              tiles.add(_buildAppTile(
                content: Container(
                  color: Colors.white.withOpacity(0.14),
                  child: const Center(child: Icon(Icons.add_rounded, size: 38, color: Colors.white)),
                ),
                label: isEn ? "Add app" : "إضافة تطبيق",
                autofocus: _favoriteApps.isEmpty,
                onTap: _openAllAppsModal,
              ));
              return SizedBox(height: 150, child: _centeredScroller(tiles, vertical: 22));
            }

