            int? _mins(dynamic v) {
              final str = _s(v);
              final m = RegExp(r'(\d{1,2}):(\d{2})').firstMatch(str);
              if (m == null) return null;
              return int.parse(m.group(1)!) * 60 + int.parse(m.group(2)!);
            }

            void _applyAnchors(dynamic timings) {
              final f = _mins(timings['Fajr']);
              final r = _mins(timings['Sunrise']);
              final d = _mins(timings['Dhuhr']);
              final a = _mins(timings['Asr']);
              final m = _mins(timings['Maghrib']);
              final i = _mins(timings['Isha']);
              if (f == null || r == null || d == null || a == null || m == null || i == null) return;
              final ok = f + 20 < r && r + 90 < d && d < a && a < m - 40 && m + 30 < i && i + 60 < f - 40 + 1440;
              if (!ok) return;
              _aFajr = f;
              _aSunrise = r;
              _aDhuhr = d;
              _aAsr = a;
              _aMaghrib = m;
              _aIsha = i;
            }

            Future<void> _loadBackgroundAssets() async {
              try {
                final manifest = await AssetManifest.loadFromAssetBundle(rootBundle);
                final map = <String, String>{};
              final vids = <String, String>{};
              for (final a in manifest.listAssets()) {
                  if (!a.startsWith('assets/backgrounds/')) continue;
                  final file = a.split('/').last;
                  final dot = file.lastIndexOf('.');
                  if (dot <= 0) continue;
                  final ext = file.substring(dot + 1).toLowerCase();
                final base = file.substring(0, dot).toLowerCase();
                if (ext == 'mp4' || ext == 'webm' || ext == 'mkv') {
                  vids[base] = a;
                  continue;
                }
                if (ext != 'jpg' && ext != 'jpeg' && ext != 'png') continue;
                map[base] = a;
                }
                if (mounted) {
                setState(() {
                  _bgFiles = map;
                  _bgVideoAssets = vids;
                });
                _syncVideo();
              }
              } catch (_) {}
            }

            List<MapEntry<int, String>> _bgTimeline({bool all = false}) {
              final dawnName = _hasBg('dawn') ? 'dawn' : 'dusk';
              final raw = <MapEntry<int, String>>[
                MapEntry(0, 'night_stars'),
                MapEntry(_aFajr - 50, 'night_stars'),
                MapEntry(_aFajr + 15, dawnName),
                MapEntry(_aSunrise + 5, 'sunrise'),
                MapEntry(_aSunrise + 90, 'morning'),
                MapEntry(_aDhuhr - 30, 'noon'),
                MapEntry(_aMaghrib - 100, 'noon'),
                MapEntry(_aMaghrib - 45, 'golden'),
                MapEntry(_aMaghrib - 5, 'sunset'),
                MapEntry(_aMaghrib + 45, 'dusk'),
                MapEntry(_aIsha + 30, 'night_moon'),
                MapEntry(_aIsha + 240, 'night_moon'),
                MapEntry(1440, 'night_stars'),
              ];
              final out = <MapEntry<int, String>>[];
              var last = -1;
              for (final e in raw) {
                if (!all && !_hasBg(e.value)) continue;
                if (e.key <= last || e.key > 1440) continue;
                last = e.key;
                out.add(e);
              }
              return out;
            }

