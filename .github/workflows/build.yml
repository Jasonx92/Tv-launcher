      - name: Build APK Debug
        run: |
          flutter build apk --debug --dart-define=APP_VERSION=${APP_VERSION}+${BUILD_NUMBER}
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Luban-TV-v${APP_VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luban-TV-v${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/Luban-TV-v${{ env.APP_VERSION }}.apk
