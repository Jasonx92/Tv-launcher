name: Build TV Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android TV Project
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          flutter create --org com.omantv --project-name tv_launcher --platforms=android .
          yes | flutter doctor --android-licenses || true

      - name: Configure Pubspec
        run: |
          printf "%s\n" \
            "name: tv_launcher" \
            "description: TV Launcher" \
            "publish_to: 'none'" \
            "version: 1.0.0+1" \
            "environment:" \
            "  sdk: '>=3.0.0 <4.0.0'" \
            "dependencies:" \
            "  flutter:" \
            "    sdk: flutter" \
            "  intl: ^0.19.0" \
            "  installed_apps: ^2.1.1" \
            "  url_launcher: ^6.3.0" \
            "flutter:" \
            "  uses-material-design: true" \
            "  assets:" \
            "    - assets/backgrounds/" > pubspec.yaml

          flutter pub get
          mkdir -p assets/backgrounds
          curl -s -L -o assets/backgrounds/noon.jpg "https://picsum.photos/1920/1080"
          curl -s -L -o assets/backgrounds/night.jpg "https://picsum.photos/1920/1080"

      - name: Configure Android TV Manifest
        run: |
          printf "%s\n" \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-feature android:name="android.software.leanback" android:required="false" />' \
            '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />' \
            '    <application' \
            '        android:label="Oman TV Launcher"' \
            '        android:name="${applicationName}"' \
            '        android:icon="@mipmap/ic_launcher">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true"' \
            '            android:launchMode="singleTop"' \
            '            android:theme="@style/LaunchTheme"' \
            '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"' \
            '            android:hardwareAccelerated="true"' \
            '            android:windowSoftInputMode="adjustResize">' \
            '            <meta-data' \
            '                android:name="io.flutter.embedding.android.NormalTheme"' \
            '                android:resource="@style/NormalTheme" />' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN"/>' \
            '                <category android:name="android.intent.category.LAUNCHER"/>' \
            '                <category android:name="android.intent.category.HOME" />' \
            '                <category android:name="android.intent.category.DEFAULT" />' \
            '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '        <meta-data' \
            '            android:name="flutterEmbedding"' \
            '            android:value="2" />' \
            '    </application>' \
            '</manifest>' > android/app/src/main/AndroidManifest.xml

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oman-TV-Launcher-v1.0.0-Mohammed-Fadhil
          path: build/app/outputs/flutter-apk/app-debug.apk
