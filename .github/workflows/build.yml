                  _shiftStep = (_shiftStep + 1) % _shiftPattern.length;
                  _shift = _shiftPattern[_shiftStep];
                });
              });
              _loadAppsAndFavorites();
              _matchesTimer = Timer.periodic(const Duration(minutes: 2), (_) => _fetchMatches());
              _clockTimer = Timer.periodic(const Duration(seconds: 1), (_) {
                final n = DateTime.now();
                if (!mounted) return;
                if (n.minute != _currentTime.minute) {
                  setState(() {
                    _currentTime = n;
                    final r = math.Random();
                    _saverAlign = Alignment(r.nextDouble() * 1.4 - 0.7, r.nextDouble() * 1.4 - 0.7);
                  });
                } else {
                  _currentTime = n;
                }
                _updateIdle();
                if (n.second % 30 == 2) _syncVideo();
              });
