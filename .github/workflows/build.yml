name: Build TV Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_VERSION: "2.4.0"
  BUILD_NUMBER: "31"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Android TV Project
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'icon.jpg' ! -name 'icon.png' ! -name 'backgrounds' -exec rm -rf {} +
          flutter create --org com.luban --project-name luban_tv --platforms=android .
          yes | flutter doctor --android-licenses || true

          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Configure Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: luban_tv
          description: "Luban Ambient Smart TV Launcher"
          publish_to: "none"
          version: 0.0.0+0

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            intl: ^0.19.0
            http: ^1.2.0
            installed_apps: ^2.2.1
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
            assets:
              - assets/backgrounds/
          EOF
          sed -i "s/^version: .*/version: ${APP_VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          mkdir -p assets/backgrounds
          echo "Put photos here named dawn*.jpg day*.jpg afternoon*.jpg sunset*.jpg night*.jpg" > assets/backgrounds/README.txt
          if [ -d backgrounds ]; then cp backgrounds/* assets/backgrounds/ 2>/dev/null || true; fi
          flutter pub get

      - name: Auto-Crop & Generate Native App Icons & TV Banner
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f "icon.jpg" ]; then
            SRC="icon.jpg"
          elif [ -f "icon.png" ]; then
            SRC="icon.png"
          else
            SRC=""
          fi

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          mkdir -p android/app/src/main/res/drawable-xhdpi

          if [ -n "$SRC" ]; then
            convert "$SRC" -gravity center -crop 1:1 +repage square_icon.png
            convert square_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert square_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert square_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert square_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert square_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$SRC" -resize 320x180^ -gravity center -extent 320x180 android/app/src/main/res/drawable-xhdpi/ic_launcher_banner.png
          fi

      - name: Configure Android TV Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              
              <application
                  android:label="Luban TV"
                  android:name="${applicationName}"
                  android:banner="@drawable/ic_launcher_banner"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF


      - name: Write Native Android Code
        run: |
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/luban/luban_tv
          cat << 'EOF' > android/app/src/main/kotlin/com/luban/luban_tv/MainActivity.kt
          package com.luban.luban_tv

          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream

          class MainActivity : FlutterActivity() {
              private val channelName = "luban/native"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getBanner" -> {
                                  val pkg = call.argument<String>("package")
                                  if (pkg == null) {
                                      result.success(null)
                                  } else {
                                      Thread {
                                          val bytes: ByteArray? = try { loadBanner(pkg) } catch (e: Throwable) { null }
                                          runOnUiThread { result.success(bytes) }
                                      }.start()
                                  }
                              }
                              "openSettings" -> result.success(openSettings())
                              "launchApp" -> result.success(launchApp(call.argument<String>("package")))
                              "exitLauncher" -> result.success(exitLauncher())
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun loadBanner(pkg: String): ByteArray? {
                  val pm = packageManager
                  var d: Drawable? = null
                  try {
                      val i = pm.getLeanbackLaunchIntentForPackage(pkg)
                      if (i != null) d = pm.getActivityBanner(i)
                  } catch (e: Throwable) {
                  }
                  if (d == null) {
                      try {
                          d = pm.getApplicationBanner(pkg)
                      } catch (e: Throwable) {
                      }
                  }
                  if (d == null) return null
                  val bmp = Bitmap.createBitmap(320, 180, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  d.setBounds(0, 0, 320, 180)
                  d.draw(canvas)
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.PNG, 100, out)
                  return out.toByteArray()
              }

              private fun openSettings(): Boolean {
                  return try {
                      val i = Intent(Settings.ACTION_SETTINGS)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }

              private fun launchApp(pkg: String?): Boolean {
                  if (pkg == null) return false
                  return try {
                      val pm = packageManager
                      val i = pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg)
                      if (i == null) {
                          false
                      } else {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                          true
                      }
                  } catch (e: Throwable) {
                      false
                  }
              }

              private fun exitLauncher(): Boolean {
                  return try {
                      val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      val others = packageManager.queryIntentActivities(homeIntent, 0)
                          .filter { it.activityInfo.packageName != packageName }
                      val target = others.firstOrNull()
                      val i: Intent
                      if (target != null) {
                          i = Intent(Intent.ACTION_MAIN)
                          i.addCategory(Intent.CATEGORY_HOME)
                          i.component = ComponentName(target.activityInfo.packageName, target.activityInfo.name)
                      } else {
                          i = Intent(Settings.ACTION_HOME_SETTINGS)
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }
          }
          EOF

      - name: Write Complete Launcher Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui' show ImageFilter;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:installed_apps/app_info.dart';
          import 'package:installed_apps/installed_apps.dart';
          import 'package:intl/intl.dart' hide TextDirection;
          import 'package:intl/date_symbol_data_local.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          class _TvFocusable extends StatefulWidget {
            final Widget Function(BuildContext context, bool focused) builder;
            final VoidCallback onTap;
            final VoidCallback? onLongPress;
            final bool autofocus;

            const _TvFocusable({
              required this.builder,
              required this.onTap,
              this.onLongPress,
              this.autofocus = false,
            });

            @override
            State<_TvFocusable> createState() => _TvFocusableState();
          }

          class _TvFocusableState extends State<_TvFocusable> {
            bool _focused = false;
            bool _longFired = false;

            KeyEventResult _onKey(FocusNode node, KeyEvent event) {
              final k = event.logicalKey;
              final isSelect = k == LogicalKeyboardKey.select ||
                  k == LogicalKeyboardKey.enter ||
                  k == LogicalKeyboardKey.numpadEnter ||
                  k == LogicalKeyboardKey.gameButtonA;
              if (!isSelect) return KeyEventResult.ignored;

              if (event is KeyDownEvent) {
                _longFired = false;
                return KeyEventResult.handled;
              }
              if (event is KeyRepeatEvent) {
                if (!_longFired && widget.onLongPress != null) {
                  _longFired = true;
                  widget.onLongPress!();
                }
                return KeyEventResult.handled;
              }
              if (event is KeyUpEvent) {
                if (!_longFired) widget.onTap();
                _longFired = false;
                return KeyEventResult.handled;
              }
              return KeyEventResult.ignored;
            }

            void _onFocusChange(bool f) {
              if (!mounted) return;
              setState(() => _focused = f);
              if (f) {
                Scrollable.ensureVisible(
                  context,
                  alignment: 0.5,
                  duration: const Duration(milliseconds: 220),
                  curve: Curves.easeOutCubic,
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Focus(
                autofocus: widget.autofocus,
                onKeyEvent: _onKey,
                onFocusChange: _onFocusChange,
                child: GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTap: widget.onTap,
                  onLongPress: widget.onLongPress,
                  child: widget.builder(context, _focused),
                ),
              );
            }
          }

          class _SkyKey {
            final int m;
            final Color top;
            final Color bottom;
            const _SkyKey(this.m, this.top, this.bottom);
          }

          class _SkyPainter extends CustomPainter {
            final int minute;
            final int fajr;
            final int sunrise;
            final int dhuhr;
            final int asr;
            final int maghrib;
            final int isha;

            const _SkyPainter({
              required this.minute,
              required this.fajr,
              required this.sunrise,
              required this.dhuhr,
              required this.asr,
              required this.maghrib,
              required this.isha,
            });

            static final List<Offset> _stars = () {
              final r = math.Random(7);
              return List<Offset>.generate(110, (_) => Offset(r.nextDouble(), r.nextDouble() * 0.58));
            }();

            List<_SkyKey> _keys() {
              return [
                _SkyKey(fajr - 40, const Color(0xFF050B1E), const Color(0xFF0E1836)),
                _SkyKey(fajr + 20, const Color(0xFF1E2A5A), const Color(0xFF6B4A7A)),
                _SkyKey(sunrise, const Color(0xFF4A74B8), const Color(0xFFFFB27A)),
                _SkyKey(sunrise + 90, const Color(0xFF3B8FD9), const Color(0xFF9FD3F5)),
                _SkyKey(dhuhr, const Color(0xFF1E88E5), const Color(0xFF8EC9F7)),
                _SkyKey(asr, const Color(0xFF2F8FDF), const Color(0xFFB6DBF5)),
                _SkyKey(maghrib - 40, const Color(0xFF3A7BC8), const Color(0xFFFFC37A)),
                _SkyKey(maghrib, const Color(0xFF3B3F85), const Color(0xFFFF7E4D)),
                _SkyKey(maghrib + 30, const Color(0xFF1D2250), const Color(0xFF8A3F6B)),
                _SkyKey(isha, const Color(0xFF0B1230), const Color(0xFF1B2A55)),
                _SkyKey(isha + 60, const Color(0xFF050B1E), const Color(0xFF0E1836)),
              ];
            }

            List<Color> _sky(double t) {
              final k = _keys();
              final ext = <_SkyKey>[
                _SkyKey(k.last.m - 1440, k.last.top, k.last.bottom),
                ...k,
                _SkyKey(k.first.m + 1440, k.first.top, k.first.bottom),
              ];
              for (var i = 0; i < ext.length - 1; i++) {
                final a = ext[i];
                final b = ext[i + 1];
                if (t >= a.m && t < b.m) {
                  final f = (t - a.m) / (b.m - a.m);
                  return [Color.lerp(a.top, b.top, f)!, Color.lerp(a.bottom, b.bottom, f)!];
                }
              }
              return [k.first.top, k.first.bottom];
            }

            @override
            void paint(Canvas canvas, Size size) {
              final w = size.width;
              final h = size.height;
              final t = minute.toDouble();
              final sky = _sky(t);
              final top = sky[0];
              final bottom = sky[1];
              final horizon = h * 0.62;

              final skyRect = Rect.fromLTWH(0, 0, w, horizon + 2);
              canvas.drawRect(
                skyRect,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [top, bottom],
                  ).createShader(skyRect),
              );

              final dark = ((0.06 - top.computeLuminance()) / 0.05).clamp(0.0, 1.0).toDouble();
              if (dark > 0) {
                final sp = Paint();
                for (var i = 0; i < _stars.length; i++) {
                  final st = _stars[i];
                  final a = dark * (0.35 + 0.65 * ((i * 37) % 10) / 10);
                  sp.color = Colors.white.withOpacity(a);
                  canvas.drawCircle(Offset(st.dx * w, st.dy * h), i % 7 == 0 ? 1.6 : 0.9, sp);
                }
              }

              final day = (1 - dark).clamp(0.0, 1.0).toDouble();
              final cloudColor = Color.lerp(bottom, Colors.white, 0.6)!;
              final cp = Paint()
                ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 16)
                ..color = cloudColor.withOpacity(0.10 + 0.28 * day);
              const clouds = [
                [0.16, 0.16, 230.0, 34.0],
                [0.52, 0.27, 320.0, 44.0],
                [0.84, 0.13, 210.0, 30.0],
                [0.33, 0.42, 260.0, 34.0],
              ];
              for (final c in clouds) {
                final cx = c[0] * w;
                final cy = c[1] * h;
                canvas.drawOval(Rect.fromCenter(center: Offset(cx, cy), width: c[2], height: c[3]), cp);
                canvas.drawOval(
                  Rect.fromCenter(center: Offset(cx + c[2] * 0.25, cy - c[3] * 0.35), width: c[2] * 0.6, height: c[3] * 0.9),
                  cp,
                );
              }

              Offset? lightPos;
              Color lightColor = Colors.white;
              double lightAlpha = 0;

              final sStart = sunrise - 20.0;
              final sEnd = maghrib + 20.0;
              if (t >= sStart && t <= sEnd) {
                final p = (t - sStart) / (sEnd - sStart);
                final x = w * (0.12 + 0.76 * p);
                final y = horizon - math.sin(math.pi * p) * h * 0.46;
                final hi = math.sin(math.pi * p).clamp(0.0, 1.0).toDouble();
                final col = Color.lerp(const Color(0xFFFF8A3D), const Color(0xFFFFF3C4), math.sqrt(hi))!;
                final glowRect = Rect.fromCircle(center: Offset(x, y), radius: 110);
                canvas.drawCircle(
                  Offset(x, y),
                  110,
                  Paint()..shader = RadialGradient(colors: [col.withOpacity(0.55), col.withOpacity(0.0)]).createShader(glowRect),
                );
                canvas.drawCircle(Offset(x, y), 22, Paint()..color = col);
                lightPos = Offset(x, y);
                lightColor = col;
                lightAlpha = 0.55;
              }

              final tm = t < sunrise ? t + 1440 : t;
              final mStart = maghrib - 10.0;
              final mEnd = sunrise + 1440.0 + 10.0;
              if (tm >= mStart && tm <= mEnd) {
                final p = (tm - mStart) / (mEnd - mStart);
                final x = w * (0.12 + 0.76 * p);
                final y = horizon - math.sin(math.pi * p) * h * 0.5;
                final vis = (math.min(p, 1 - p) * 10).clamp(0.0, 1.0).toDouble();
                final glowRect = Rect.fromCircle(center: Offset(x, y), radius: 80);
                canvas.drawCircle(
                  Offset(x, y),
                  80,
                  Paint()
                    ..shader = RadialGradient(
                      colors: [const Color(0xFFBFD7FF).withOpacity(0.35 * vis), const Color(0xFFBFD7FF).withOpacity(0.0)],
                    ).createShader(glowRect),
                );
                final moonPath = Path.combine(
                  PathOperation.difference,
                  Path()..addOval(Rect.fromCircle(center: Offset(x, y), radius: 18)),
                  Path()..addOval(Rect.fromCircle(center: Offset(x + 8, y - 4), radius: 16)),
                );
                canvas.drawPath(moonPath, Paint()..color = const Color(0xFFFFF8E1).withOpacity(vis));
                if (lightPos == null) {
                  lightPos = Offset(x, y);
                  lightColor = const Color(0xFFDCE8FF);
                  lightAlpha = 0.45 * vis;
                }
              }

              final hill = Paint()..color = Color.lerp(top, Colors.black, 0.55)!.withOpacity(0.85);
              final hp = Path()
                ..moveTo(0, horizon)
                ..quadraticBezierTo(w * 0.07, horizon - h * 0.07, w * 0.17, horizon - h * 0.025)
                ..quadraticBezierTo(w * 0.26, horizon - h * 0.005, w * 0.34, horizon)
                ..close();
              canvas.drawPath(hp, hill);
              final hp2 = Path()
                ..moveTo(w, horizon)
                ..quadraticBezierTo(w * 0.94, horizon - h * 0.045, w * 0.86, horizon)
                ..close();
              canvas.drawPath(hp2, hill);

              final seaRect = Rect.fromLTWH(0, horizon, w, h - horizon);
              canvas.drawRect(
                seaRect,
                Paint()
                  ..shader = LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [
                      Color.lerp(bottom, Colors.black, 0.20)!,
                      Color.lerp(top, Colors.black, 0.55)!,
                    ],
                  ).createShader(seaRect),
              );
              canvas.drawRect(Rect.fromLTWH(0, horizon - 1, w, 2), Paint()..color = bottom.withOpacity(0.5));

              if (lightPos != null) {
                final rp = Paint();
                const n = 16;
                for (var i = 0; i < n; i++) {
                  final fy = horizon + 6 + i * ((h - horizon - 8) / n);
                  final fw = 26.0 + i * 11.0 * (1 + 0.35 * math.sin(i * 1.7));
                  rp.color = lightColor.withOpacity((lightAlpha * (1 - i / n) * 0.8).clamp(0.0, 1.0).toDouble());
                  canvas.drawRRect(
                    RRect.fromRectAndRadius(
                      Rect.fromCenter(center: Offset(lightPos.dx, fy), width: fw, height: 2.6),
                      const Radius.circular(2),
                    ),
                    rp,
                  );
                }
              }
            }

            @override
            bool shouldRepaint(covariant _SkyPainter old) {
              return old.minute != minute ||
                  old.fajr != fajr ||
                  old.sunrise != sunrise ||
                  old.dhuhr != dhuhr ||
                  old.asr != asr ||
                  old.maghrib != maghrib ||
                  old.isha != isha;
            }
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await initializeDateFormatting('ar', null);
            await initializeDateFormatting('en', null);
            await SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            runApp(const LubanTVApp());
          }

          class LubanTVApp extends StatefulWidget {
            const LubanTVApp({super.key});

            static void updateFont(BuildContext context) {
              context.findAncestorStateOfType<_LubanTVAppState>()?.loadFontSetting();
            }

            @override
            State<LubanTVApp> createState() => _LubanTVAppState();
          }

          class _LubanTVAppState extends State<LubanTVApp> {
            String _selectedFont = 'sans-serif';

            @override
            void initState() {
              super.initState();
              loadFontSetting();
            }

            Future<void> loadFontSetting() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedFont = prefs.getString('pref_font') ?? 'sans-serif';
              });
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Luban TV',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  fontFamily: _selectedFont,
                ),
                home: const LubanHomeScreen(),
              );
            }
          }

          class LubanHomeScreen extends StatefulWidget {
            const LubanHomeScreen({super.key});

            @override
            State<LubanHomeScreen> createState() => _LubanHomeScreenState();
          }

          class _LubanHomeScreenState extends State<LubanHomeScreen> {
            DateTime _currentTime = DateTime.now();
            Timer? _clockTimer;
            List<AppInfo> _allInstalledApps = [];
            List<AppInfo> _favoriteApps = [];
            bool _loadingApps = true;
            String _hijriDateStr = "-- هـ";
            String _selectedCity = "Salalah";
            String _selectedCityAr = "صلالة";
            String _selectedLanguage = "hybrid";
            String _selectedFont = "sans-serif";
            bool _showMatchesBar = true;

            Map<String, String> _prayerTimes = {
              'الفجر': '--:--',
              'الظهر': '--:--',
              'العصر': '--:--',
              'المغرب': '--:--',
              'العشاء': '--:--',
            };

            List<Map<String, String>> _matches = [];
            bool _matchesLoading = true;
            String _matchesError = '';
            Timer? _matchesTimer;

            @override
            void initState() {
              super.initState();
              _loadPreferences();
              _loadBackgroundAssets();
              _loadAppsAndFavorites();
              _matchesTimer = Timer.periodic(const Duration(minutes: 2), (_) => _fetchMatches());
              _clockTimer = Timer.periodic(const Duration(seconds: 1), (_) {
                final n = DateTime.now();
                if (!mounted) return;
                if (n.minute != _currentTime.minute) {
                  setState(() => _currentTime = n);
                } else {
                  _currentTime = n;
                }
              });
            }

            @override
            void dispose() {
              _clockTimer?.cancel();
              _matchesTimer?.cancel();
              super.dispose();
            }

            Future<void> _loadPreferences() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedCity = prefs.getString('pref_city') ?? "Salalah";
                _selectedCityAr = prefs.getString('pref_city_ar') ?? "صلالة";
                _selectedLanguage = prefs.getString('pref_language') ?? "hybrid";
                _selectedFont = prefs.getString('pref_font') ?? "sans-serif";
                _showMatchesBar = prefs.getBool('pref_show_matches') ?? true;
                final savedLeagues = prefs.getStringList('pref_leagues');
                if (savedLeagues != null) {
                  _selectedLeagues = savedLeagues.where((l) => _leagueAr.containsKey(l)).toSet();
                }
              });
              _fetchPrayerAndDateData();
              _fetchMatches();
            }

            Future<void> _loadAppsAndFavorites() async {
              try {
                final apps = await InstalledApps.getInstalledApps(excludeSystemApps: false, withIcon: true);
                final prefs = await SharedPreferences.getInstance();
                final savedFavs = prefs.getStringList('fav_apps');

                List<AppInfo> favs = [];
                if (savedFavs != null && savedFavs.isNotEmpty) {
                  for (var pkg in savedFavs) {
                    final matches = apps.where((a) => a.packageName == pkg);
                    if (matches.isNotEmpty) favs.add(matches.first);
                  }
                } else {
                  favs = apps.take(7).toList();
                  await _saveFavorites(favs);
                }

                if (mounted) {
                  setState(() {
                    _allInstalledApps = apps;
                    _favoriteApps = favs;
                    _loadingApps = false;
                  });
                  for (final a in favs) {
                    _ensureBanner(a.packageName);
                  }
                }
              } catch (_) {
                if (mounted) setState(() => _loadingApps = false);
              }
            }

            Future<void> _saveFavorites(List<AppInfo> apps) async {
              final prefs = await SharedPreferences.getInstance();
              final pkgList = apps.map((a) => a.packageName).toList();
              await prefs.setStringList('fav_apps', pkgList);
            }

            void _moveApp(int oldIndex, int newIndex) {
              if (newIndex < 0 || newIndex >= _favoriteApps.length) return;
              setState(() {
                final item = _favoriteApps.removeAt(oldIndex);
                _favoriteApps.insert(newIndex, item);
              });
              _saveFavorites(_favoriteApps);
            }

            void _removeApp(int index) {
              setState(() {
                _favoriteApps.removeAt(index);
              });
              _saveFavorites(_favoriteApps);
            }

            void _addAppToFav(AppInfo app) {
              if (_favoriteApps.any((a) => a.packageName == app.packageName)) return;
              setState(() {
                _favoriteApps.add(app);
              });
              _ensureBanner(app.packageName);
              _saveFavorites(_favoriteApps);
            }

            Future<void> _openSystemSettings() async {
              bool ok = false;
              try {
                ok = (await _native.invokeMethod<bool>('openSettings')) ?? false;
              } catch (_) {}
              if (!ok) {
                try {
                  await InstalledApps.startApp('com.android.tv.settings');
                } catch (_) {}
              }
            }

            Future<void> _launchApp(String pkg) async {
              bool ok = false;
              try {
                ok = (await _native.invokeMethod<bool>('launchApp', {'package': pkg})) ?? false;
              } catch (_) {}
              if (!ok) {
                try {
                  await InstalledApps.startApp(pkg);
                } catch (_) {}
              }
            }

            Future<void> _ensureBanner(String pkg) async {
              if (_bannerTried.contains(pkg)) return;
              _bannerTried.add(pkg);
              try {
                final bytes = await _native.invokeMethod<Uint8List>('getBanner', {'package': pkg});
                if (bytes != null && bytes.isNotEmpty && mounted) {
                  setState(() => _banners[pkg] = bytes);
                }
              } catch (_) {}
            }

