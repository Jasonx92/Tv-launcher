            @override
            void dispose() {
              _clockTimer?.cancel();
              _matchesTimer?.cancel();
              _liveTimer?.cancel();
              _shiftTimer?.cancel();
              HardwareKeyboard.instance.removeHandler(_onGlobalKey);
              WidgetsBinding.instance.removeObserver(this);
              _vc?.dispose();
              super.dispose();
