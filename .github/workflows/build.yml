            void _loadLiveCache(SharedPreferences prefs) {
              try {
                final raw = prefs.getString('live_files');
                if (raw == null) return;
                final m = json.decode(raw) as Map<String, dynamic>;
                final files = <String, String>{};
                final credits = <String, String>{};
                m.forEach((k, v) {
                  final path = _s(v['path']);
                  if (path.isNotEmpty && File(path).existsSync()) {
                    files[k] = path;
                    credits[k] = _s(v['credit']);
                  }
                });
                if (mounted) {
                  setState(() {
                    _liveFiles = files;
                    _liveCredits = credits;
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveLiveCache() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final m = <String, dynamic>{};
                _liveFiles.forEach((k, v) => m[k] = {'path': v, 'credit': _liveCredits[k] ?? ''});
                await prefs.setString('live_files', json.encode(m));
              } catch (_) {}
            }

            void _restartLiveTimer() {
              _liveTimer?.cancel();
              _liveTimer = null;
              if (!_liveEnabled && _bgMode != 'video') return;
            _liveTimer = Timer.periodic(Duration(minutes: _liveMinutes), (_) {
              _refreshLive();
              _refreshVideo();
            });
            }

            Future<void> _refreshLive() async {
              if (!_liveEnabled || _liveBusy) return;
              _liveBusy = true;
              try {
                final p = _bgPair(all: true);
                if (p.a.isEmpty) return;
                final dom = p.f < 0.5 ? p.a : p.b;
                final names = <String>{dom};
                for (final n in [p.a, p.b]) {
                  if (!_liveFiles.containsKey(n)) names.add(n);
                }
                for (final n in names.take(2)) {
                  await _refreshLiveFor(n);
                }
              } catch (_) {
              } finally {
                _liveBusy = false;
              }
            }

            Future<void> _refreshLiveFor(String name) async {
              final q = _liveQueries[name];
              if (q == null) return;
              for (final cat in const ['Featured pictures on Wikimedia Commons', 'Quality images']) {
                final r = await _tryLive(name, q, cat);
                if (r != 0) return;
              }
            }

            Future<int> _tryLive(String name, String q, String cat) async {
              try {
                final uri = Uri.https('commons.wikimedia.org', '/w/api.php', {
                  'action': 'query',
                  'format': 'json',
                  'formatversion': '2',
                  'generator': 'search',
                  'gsrnamespace': '6',
                  'gsrlimit': '40',
                  'gsrsearch': 'filetype:bitmap incategory:"$cat" $q',
                  'prop': 'imageinfo',
                  'iiprop': 'url|size|mime|extmetadata',
                  'iiurlwidth': '1920',
                  'iiextmetadatafilter': 'Artist|LicenseShortName',
                });
                final ua = {'User-Agent': 'LubanTV/$_appVersion (personal Android TV launcher)'};
                final res = await http.get(uri, headers: ua).timeout(const Duration(seconds: 20));
                if (res.statusCode != 200) return -1;

                final body = json.decode(utf8.decode(res.bodyBytes));
                final pages = (body['query']?['pages'] as List?) ?? [];
                final licRe = RegExp(r'^(CC|Public domain|PD)', caseSensitive: false);
                final cands = <Map<String, dynamic>>[];
                for (final pg in pages) {
                  final infos = pg['imageinfo'] as List?;
                  if (infos == null || infos.isEmpty) continue;
                  final info = infos.first;
                  if (_s(info['mime']) != 'image/jpeg') continue;
                  final w = (info['width'] as num?) ?? 0;
                  final h = (info['height'] as num?) ?? 1;
                  if (w < 2000 || w / h < 1.45) continue;
                  final lic = _s(info['extmetadata']?['LicenseShortName']?['value']);
                  if (!licRe.hasMatch(lic)) continue;
                  final title = _s(pg['title']);
                  if (title == _lastLiveTitle[name]) continue;
                  cands.add({'title': title, 'info': info, 'lic': lic});
                }
                if (cands.isEmpty) return 0;

                final pick = cands[math.Random().nextInt(cands.length)];
                final info = pick['info'];
                final thumb = _s(info['thumburl']);
                final url = thumb.isNotEmpty ? thumb : _s(info['url']);
                if (url.isEmpty) return -1;

                final img = await http.get(Uri.parse(url), headers: ua).timeout(const Duration(seconds: 60));
                final bytes = img.bodyBytes;
                if (img.statusCode != 200 || bytes.length < 30000 || bytes[0] != 0xFF || bytes[1] != 0xD8) return -1;

                final dir = await getApplicationSupportDirectory();
                final bgDir = Directory('${dir.path}/bg');
                if (!await bgDir.exists()) await bgDir.create(recursive: true);
                final path = '${bgDir.path}/live_${name}_${DateTime.now().millisecondsSinceEpoch}.jpg';
                await File(path).writeAsBytes(bytes);

                var artist = _s(info['extmetadata']?['Artist']?['value']).replaceAll(RegExp(r'<[^>]*>'), '').replaceAll('&amp;', '&').trim();
                if (artist.length > 40) artist = artist.substring(0, 40);
                final credit = '${artist.isEmpty ? 'Unknown' : artist} · ${pick['lic']} · Wikimedia Commons';

                final old = _liveFiles[name];
                _lastLiveTitle[name] = _s(pick['title']);
                if (!mounted) return 1;
                setState(() {
                  _liveFiles[name] = path;
                  _liveCredits[name] = credit;
                });
                _saveLiveCache();
                if (old != null) {
                  Future.delayed(const Duration(seconds: 15), () {
                    try {
                      File(old).deleteSync();
                    } catch (_) {}
                  });
                }
                return 1;
              } catch (_) {
                return -1;
              }
            }

            void _touch() {
              _lastActivity = DateTime.now();
              if (_idleState != 0) _setIdle(0);
            }

            bool _onGlobalKey(KeyEvent e) {
              if (_wakeKey != null && e.logicalKey == _wakeKey) {
                if (e is KeyUpEvent) _wakeKey = null;
                return true;
              }
              if (e is KeyDownEvent || e is KeyRepeatEvent) {
                final wasIdle = _idleState != 0;
                _lastActivity = DateTime.now();
                if (wasIdle) {
                  _setIdle(0);
                  if (e is KeyDownEvent) _wakeKey = e.logicalKey;
                  return true;
                }
              }
              return false;
            }

            void _updateIdle() {
              int st = 0;
              if (_saverMin > 0) {
                final idle = DateTime.now().difference(_lastActivity).inSeconds;
                final saverAt = _saverMin * 60;
                final dimAt = saverAt ~/ 2;
                st = idle >= saverAt ? 2 : (idle >= dimAt ? 1 : 0);
              }
              if (st != _idleState) _setIdle(st);
            }

