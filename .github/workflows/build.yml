            void _setIdle(int st) {
              if (!mounted) return;
              setState(() => _idleState = st);
              final c = _vc;
              if (c != null && c.value.isInitialized) {
                if (st == 2) {
                  c.pause();
                } else {
                  c.play();
                }
              }
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              final c = _vc;
              if (c == null || !c.value.isInitialized) return;
              if (state == AppLifecycleState.resumed) {
                if (_idleState != 2) c.play();
              } else {
                c.pause();
              }
            }

            void _loadVideoCache(SharedPreferences prefs) {
              try {
                final raw = prefs.getString('video_files');
                if (raw == null) return;
                final m = json.decode(raw) as Map<String, dynamic>;
                final files = <String, String>{};
                final credits = <String, String>{};
                final stamps = <String, int>{};
                m.forEach((k, v) {
                  final path = _s(v['path']);
                  if (path.isNotEmpty && File(path).existsSync()) {
                    files[k] = path;
                    credits[k] = _s(v['credit']);
                    stamps[k] = (v['ts'] as num?)?.toInt() ?? 0;
                  }
                });
                if (mounted) {
                  setState(() {
                    _videoFiles = files;
                    _videoCredits = credits;
                    _videoStamp = stamps;
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveVideoCache() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                final m = <String, dynamic>{};
                _videoFiles.forEach((k, v) => m[k] = {'path': v, 'credit': _videoCredits[k] ?? '', 'ts': _videoStamp[k] ?? 0});
                await prefs.setString('video_files', json.encode(m));
              } catch (_) {}
            }

            Future<void> _disposeVideo() async {
              final c = _vc;
              if (c == null) return;
              if (mounted) {
                setState(() {
                  _vc = null;
                  _vcSrc = '';
                  _vcName = '';
                });
              }
              Future.delayed(const Duration(seconds: 3), () => c.dispose());
            }

            Future<void> _syncVideo() async {
              if (!mounted) return;
              if (_bgMode != 'video') {
                await _disposeVideo();
                return;
              }
              final p = _bgPair(all: true);
              if (p.a.isEmpty) return;
              final dom = p.f < 0.5 ? p.a : p.b;
              final cached = _videoFiles[dom];
              final asset = _bgVideoAssets[dom];
              final String? path = cached ?? asset;
              if (path == null) {
                await _disposeVideo();
                return;
              }
              if (path == _vcSrc || _vcBusy) return;
              _vcBusy = true;
              try {
                final c = cached != null
                    ? VideoPlayerController.file(File(cached), videoPlayerOptions: VideoPlayerOptions(mixWithOthers: true))
                    : VideoPlayerController.asset(asset!, videoPlayerOptions: VideoPlayerOptions(mixWithOthers: true));
                await c.initialize();
                await c.setLooping(true);
                await c.setVolume(0);
                if (_idleState != 2) await c.play();
                if (!mounted || _bgMode != 'video') {
                  await c.dispose();
                  return;
                }
                final old = _vc;
                setState(() {
                  _vc = c;
                  _vcSrc = path;
                  _vcName = dom;
                });
                if (old != null) Future.delayed(const Duration(seconds: 3), () => old.dispose());
              } catch (_) {
              } finally {
                _vcBusy = false;
              }
            }

            Future<void> _refreshVideo() async {
              if (_bgMode != 'video' || _videoBusy) return;
              _videoBusy = true;
              try {
                final p = _bgPair(all: true);
                if (p.a.isEmpty) return;
                final dom = p.f < 0.5 ? p.a : p.b;
                final other = dom == p.a ? p.b : p.a;
                final names = <String>[dom];
                if (other != dom) names.add(other);
                final now = DateTime.now().millisecondsSinceEpoch;
                for (final n in names) {
                  final fresh = _videoFiles.containsKey(n) && now - (_videoStamp[n] ?? 0) < 24 * 3600 * 1000;
                  if (fresh) continue;
                  await _fetchVideoFor(n);
                }
              } catch (_) {
              } finally {
                _videoBusy = false;
              }
            }

            Future<void> _fetchVideoFor(String name) async {
              final q = _videoQueries[name];
              if (q == null) return;
              for (final cat in const ['Featured videos', '']) {
                final r = await _tryVideo(name, q, cat);
                if (r != 0) return;
              }
            }

            Future<int> _tryVideo(String name, String q, String cat) async {
              try {
                final uri = Uri.https('commons.wikimedia.org', '/w/api.php', {
                  'action': 'query',
                  'format': 'json',
                  'formatversion': '2',
                  'generator': 'search',
                  'gsrnamespace': '6',
                  'gsrlimit': '30',
                  'gsrsearch': cat.isEmpty ? 'filetype:video $q' : 'filetype:video incategory:"$cat" $q',
                  'prop': 'videoinfo',
                  'viprop': 'url|size|mime|derivatives|extmetadata',
                  'viextmetadatafilter': 'Artist|LicenseShortName',
                });
                final ua = {'User-Agent': 'LubanTV/$_appVersion (personal Android TV launcher)'};
                final res = await http.get(uri, headers: ua).timeout(const Duration(seconds: 20));
                if (res.statusCode != 200) return -1;

                final body = json.decode(utf8.decode(res.bodyBytes));
                final pages = (body['query']?['pages'] as List?) ?? [];
                final licRe = RegExp(r'^(CC|Public domain|PD)', caseSensitive: false);
                final cands = <Map<String, dynamic>>[];
                for (final pg in pages) {
                  final infos = (pg['videoinfo'] ?? pg['imageinfo']) as List?;
                  if (infos == null || infos.isEmpty) continue;
                  final info = infos.first;
                  final w = (info['width'] as num?) ?? 0;
                  final h = (info['height'] as num?) ?? 0;
                  if (w > 0 && h > 0 && w / h < 1.5) continue;
                  final dur = (info['duration'] as num?) ?? 0;
                  if (dur != 0 && (dur < 6 || dur > 300)) continue;
                  final lic = _s(info['extmetadata']?['LicenseShortName']?['value']);
                  if (!licRe.hasMatch(lic)) continue;

                  String? best;
                  num bestRank = -1;
                  final ders = info['derivatives'] as List?;
                  if (ders == null) continue;
                  for (final d in ders) {
                    final type = _s(d['type']);
                    var src = _s(d['src']);
                    final dw = (d['width'] as num?) ?? 0;
                    if (src.isEmpty || !type.contains('webm')) continue;
                    if (dw < 640 || dw > 1280) continue;
                    if (src.startsWith('//')) src = 'https:$src';
                    final isVp8 = type.contains('vp8') || !type.contains('vp9');
                    final rank = dw * 2 + (isVp8 ? 1 : 0);
                    if (rank > bestRank) {
                      bestRank = rank;
                      best = src;
                    }
                  }
                  if (best == null) continue;
                  cands.add({'src': best, 'lic': lic, 'info': info});
                }
                if (cands.isEmpty) return 0;

                final pick = cands[math.Random().nextInt(cands.length)];
                final src = _s(pick['src']);

                final dir = await getApplicationSupportDirectory();
                final bgDir = Directory('${dir.path}/bg');
                if (!await bgDir.exists()) await bgDir.create(recursive: true);
                final stamp = DateTime.now().millisecondsSinceEpoch;
                final path = '${bgDir.path}/video_${name}_$stamp.webm';

                const cap = 50 * 1024 * 1024;
                final client = http.Client();
                try {
                  final req = http.Request('GET', Uri.parse(src))..headers.addAll(ua);
                  final resp = await client.send(req).timeout(const Duration(seconds: 30));
                  if (resp.statusCode != 200) return -1;
                  final len = resp.contentLength;
                  if (len != null && len > cap) return 0;
                  final sink = File(path).openWrite();
                  var got = 0;
                  var tooBig = false;
                  try {
                    await for (final chunk in resp.stream.timeout(const Duration(seconds: 30))) {
                      got += chunk.length;
                      if (got > cap) {
                        tooBig = true;
                        break;
                      }
                      sink.add(chunk);
                    }
                  } finally {
                    await sink.close();
                  }
                  if (tooBig || got < 100000) {
                    try {
                      File(path).deleteSync();
                    } catch (_) {}
                    return tooBig ? 0 : -1;
                  }
                } finally {
                  client.close();
                }

                final info = pick['info'];
                var artist = _s(info['extmetadata']?['Artist']?['value']).replaceAll(RegExp(r'<[^>]*>'), '').replaceAll('&amp;', '&').trim();
                if (artist.length > 40) artist = artist.substring(0, 40);
                final credit = '${artist.isEmpty ? 'Unknown' : artist} · ${pick['lic']} · Wikimedia Commons';

                final old = _videoFiles[name];
                if (!mounted) return 1;
                setState(() {
                  _videoFiles[name] = path;
                  _videoCredits[name] = credit;
                  _videoStamp[name] = stamp;
                });
                _saveVideoCache();
                if (old != null) {
                  Future.delayed(const Duration(seconds: 20), () {
                    try {
                      File(old).deleteSync();
                    } catch (_) {}
                  });
                }
                _syncVideo();
                return 1;
              } catch (_) {
                return -1;
              }
            }

            Future<void> _loadPreferences() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedCity = prefs.getString('pref_city') ?? "Salalah";
                _selectedCityAr = prefs.getString('pref_city_ar') ?? "صلالة";
                _selectedLanguage = prefs.getString('pref_language') ?? "hybrid";
                _selectedFont = prefs.getString('pref_font') ?? "sans-serif";
                _showMatchesBar = prefs.getBool('pref_show_matches') ?? true;
                final savedLeagues = prefs.getStringList('pref_leagues');
                if (savedLeagues != null) {
                  _selectedLeagues = savedLeagues.where((l) => _leagueAr.containsKey(l)).toSet();
                }
                _liveEnabled = prefs.getBool('pref_live') ?? true;
                final lm = prefs.getInt('pref_live_min') ?? 10;
                _liveMinutes = const [5, 10, 30].contains(lm) ? lm : 10;
                final sm = prefs.getInt('pref_saver_min') ?? 20;
                _saverMin = const [0, 10, 20, 30].contains(sm) ? sm : 20;
                _bgMode = prefs.getString('pref_bg_mode') == 'video' ? 'video' : 'photo';
              });
              _fetchPrayerAndDateData();
              _fetchMatches();
              _loadLiveCache(prefs);
              _loadVideoCache(prefs);
              _restartLiveTimer();
              Future.delayed(const Duration(seconds: 8), () {
                _refreshLive();
                _refreshVideo();
                _syncVideo();
              });
            }

            Future<void> _loadAppsAndFavorites() async {
              try {
                final apps = await InstalledApps.getInstalledApps(excludeSystemApps: false, withIcon: true);
                final prefs = await SharedPreferences.getInstance();
                final savedFavs = prefs.getStringList('fav_apps');

                List<AppInfo> favs = [];
                if (savedFavs != null && savedFavs.isNotEmpty) {
                  for (var pkg in savedFavs) {
                    final matches = apps.where((a) => a.packageName == pkg);
                    if (matches.isNotEmpty) favs.add(matches.first);
                  }
                } else {
                  favs = apps.take(7).toList();
                  await _saveFavorites(favs);
                }

                if (mounted) {
                  setState(() {
                    _allInstalledApps = apps;
                    _favoriteApps = favs;
                    _loadingApps = false;
                  });
                  for (final a in favs) {
                    _ensureBanner(a.packageName);
                  }
                }
              } catch (_) {
                if (mounted) setState(() => _loadingApps = false);
              }
            }

            Future<void> _saveFavorites(List<AppInfo> apps) async {
              final prefs = await SharedPreferences.getInstance();
              final pkgList = apps.map((a) => a.packageName).toList();
              await prefs.setStringList('fav_apps', pkgList);
            }

            void _moveApp(int oldIndex, int newIndex) {
              if (newIndex < 0 || newIndex >= _favoriteApps.length) return;
              setState(() {
                final item = _favoriteApps.removeAt(oldIndex);
                _favoriteApps.insert(newIndex, item);
              });
              _saveFavorites(_favoriteApps);
            }

            void _removeApp(int index) {
              setState(() {
                _favoriteApps.removeAt(index);
              });
              _saveFavorites(_favoriteApps);
            }

            void _addAppToFav(AppInfo app) {
              if (_favoriteApps.any((a) => a.packageName == app.packageName)) return;
              setState(() {
                _favoriteApps.add(app);
              });
              _ensureBanner(app.packageName);
              _saveFavorites(_favoriteApps);
            }

            Future<void> _openSystemSettings() async {
              bool ok = false;
              try {
                ok = (await _native.invokeMethod<bool>('openSettings')) ?? false;
              } catch (_) {}
              if (!ok) {
                try {
                  await InstalledApps.startApp('com.android.tv.settings');
                } catch (_) {}
              }
            }

            Future<void> _launchApp(String pkg) async {
              bool ok = false;
              try {
                ok = (await _native.invokeMethod<bool>('launchApp', {'package': pkg})) ?? false;
              } catch (_) {}
              if (!ok) {
                try {
                  await InstalledApps.startApp(pkg);
                } catch (_) {}
              }
            }

            Future<void> _ensureBanner(String pkg) async {
              if (_bannerTried.contains(pkg)) return;
              _bannerTried.add(pkg);
              try {
                final bytes = await _native.invokeMethod<Uint8List>('getBanner', {'package': pkg});
                if (bytes != null && bytes.isNotEmpty && mounted) {
                  setState(() => _banners[pkg] = bytes);
                }
              } catch (_) {}
            }

