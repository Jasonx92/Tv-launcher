                                                  style: const TextStyle(
                                                    fontSize: 13,
                                                    fontWeight: FontWeight.bold,
                                                    color: Color(0xFF38BDF8),
                                                  ),
                                                ),
                                              ],
                                            ),
                                          );
                                        }).toList(),
                                      ],
                                    ),
                                  ),
                                ],
                              ),

                              const Spacer(),

                              // مباريات اليوم
                              if (_showMatchesBar) ...[
                                Row(
                                  children: [
                                    const Icon(Icons.sports_soccer, size: 18, color: Color(0xFF38BDF8)),
                                    const SizedBox(width: 8),
                                    Text(
                                      isEn ? "Today's Matches" : "مباريات اليوم",
                                      style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white),
                                    ),
                                  ],
                                ),
                                _buildMatchesBar(isEn),
                              ],
                    _buildAppsBar(isEn),
                              const SizedBox(height: 6),
                            ],
                          ),
                        ),
                      ),
                      Positioned.fill(
                        child: IgnorePointer(
                          child: AnimatedContainer(
                            duration: const Duration(seconds: 2),
                            color: Colors.black.withOpacity(_idleState == 1 ? 0.6 : 0.0),
                          ),
                        ),
                      ),
                      Positioned.fill(child: _buildSaver()),
                      Positioned.fill(
                        child: Listener(
                          behavior: HitTestBehavior.translucent,
                          onPointerDown: (_) => _touch(),
                          onPointerHover: (_) => _touch(),
                          child: const SizedBox.expand(),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK Debug
        run: |
          flutter build apk --debug --dart-define=APP_VERSION=${APP_VERSION}+${BUILD_NUMBER}
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Luban-TV-v${APP_VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luban-TV-v${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/Luban-TV-v${{ env.APP_VERSION }}.apk
          compression-level: 0

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}
          name: Luban TV v${{ env.APP_VERSION }} (build ${{ env.BUILD_NUMBER }})
          files: build/app/outputs/flutter-apk/Luban-TV-v${{ env.APP_VERSION }}.apk
